<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tirupati Bastralaya Scanner</title>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#07111f;color:white;font-family:Arial,sans-serif;height:100%}
main{min-height:100%;display:flex;flex-direction:column}.head{padding:14px;text-align:center}.head b{font-size:20px}.head div{font-size:13px;color:#b9c6d8;margin-top:4px}
.stage{position:relative;flex:1;min-height:55vh;background:#000;overflow:hidden}video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.frame{position:absolute;left:7%;right:7%;top:32%;height:25%;border:3px solid #42f58d;border-radius:14px;box-shadow:0 0 0 9999px #0006}
.line{position:absolute;left:9%;right:9%;top:44%;height:2px;background:#ff4141;box-shadow:0 0 12px #ff4141}
.status{padding:14px;text-align:center;font-weight:bold;min-height:54px}.buttons{padding:0 14px 18px;display:flex;gap:8px}.buttons button{flex:1;padding:13px;border:0;border-radius:10px;font-weight:bold;font-size:16px}.cancel{background:#334155;color:#fff}.retry{background:#1d4ed8;color:#fff}
</style></head><body><main><div class="head"><b>Barcode Scanner</b><div>Place the complete barcode inside the green box</div></div>
<div class="stage"><video id="v" autoplay muted playsinline></video><div class="frame"></div><div class="line"></div></div>
<div id="status" class="status">Starting camera…</div><div class="buttons"><button class="cancel" onclick="closeScanner()">Cancel</button><button class="retry" onclick="restart()">Restart</button></div></main>
<script>
let stream=null, stopped=false, nativeDetector=null, zxing=null, busy=false, last='', lastAt=0;
const status=document.getElementById('status'), video=document.getElementById('v');
function say(x){status.textContent=x}
function stop(){stopped=true;if(stream){try{stream.getTracks().forEach(t=>t.stop())}catch(e){}stream=null}}
function closeScanner(){stop();try{window.close()}catch(e){}}
function send(code){
  if(!code)return;
  stop(); say('Scanned: '+code);
  // Return directly to the POS opener; no product/customer data leaves the POS.
  if(window.opener){window.opener.postMessage({type:'TIRUPATI_BARCODE',barcode:String(code)},'*')}
  setTimeout(()=>{try{window.close()}catch(e){}},350);
}
async function start(){
  stop();stopped=false;say('Requesting camera…');
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
    video.srcObject=stream;await video.play();say('Scanning…');
    if('BarcodeDetector'in window){
      try{
        const supported=await BarcodeDetector.getSupportedFormats();
        const formats=['code_128','ean_13','ean_8','upc_a','upc_e'].filter(x=>supported.includes(x));
        nativeDetector=new BarcodeDetector(formats.length?{formats}:undefined);
      }catch(e){nativeDetector=null}
    }
    if(window.ZXing){
      try{
        const hints=new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
        zxing=new ZXing.BrowserMultiFormatReader(hints);
      }catch(e){zxing=null}
    }
    requestAnimationFrame(loop);
  }catch(e){say(e.name==='NotAllowedError'?'Camera permission denied. Allow camera for this scanner site and tap Restart.':'Camera error: '+(e.message||e.name))}
}
async function loop(t){
  if(stopped)return;
  if(busy||video.readyState<2||t-lastAt<120){requestAnimationFrame(loop);return}
  busy=true;lastAt=t;
  try{
    if(nativeDetector){
      const a=await nativeDetector.detect(video);
      if(a&&a.length){send(a[0].rawValue);return}
    }
    if(zxing){
      try{
        const r=await zxing.decodeOnceFromVideoElement(video);
        if(r){send(r.getText());return}
      }catch(e){}
    }
  }catch(e){}
  busy=false;if(!stopped)requestAnimationFrame(loop);
}
function restart(){start()}
window.addEventListener('load',start);window.addEventListener('beforeunload',stop);
</script></body></html>
