<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#05080d"><title>Tirupati Live Scanner</title><script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;color:#fff;font-family:Arial,sans-serif}video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}.top{position:fixed;top:0;left:0;right:0;z-index:5;padding:20px;text-align:center;background:linear-gradient(#000b,transparent);font-weight:800}.box{position:fixed;z-index:4;left:7%;right:7%;top:50%;height:190px;transform:translateY(-50%);border:3px solid #39f28d;border-radius:18px;box-shadow:0 0 0 9999px #0006}.line{position:absolute;left:5%;right:5%;height:2px;background:#39f28d;box-shadow:0 0 12px #39f28d;animation:s 1.5s ease-in-out infinite alternate}@keyframes s{from{top:8%}to{top:90%}}.hint{position:fixed;z-index:5;top:calc(50% + 115px);left:0;right:0;text-align:center}.bottom{position:fixed;z-index:6;bottom:25px;left:0;right:0;text-align:center}button{border:0;border-radius:30px;padding:13px 18px;margin:5px;font-weight:700}.ok{display:none;position:fixed;inset:0;z-index:20;background:#000c;align-items:center;justify-content:center;text-align:center}.ok.show{display:flex}.tick{font-size:60px;color:#39f28d}.code{font-size:22px;font-weight:800}
</style></head><body><video id="v" playsinline muted></video><div class="top">TIRUPATI BASTRALAYA<br><small>LIVE BARCODE SCANNER</small></div><div class="box"><div class="line"></div></div><div class="hint" id="st">Starting rear camera…</div><div class="bottom"><button id="torch" style="display:none">🔦 Torch</button><button onclick="stop();window.close()">✕ Cancel</button></div><div id="ok" class="ok"><div><div class="tick">✓</div><div id="code" class="code"></div><p>Barcode detected</p></div></div>
<script>
let stream,detector,reader,done=false,torch=false,last=0;const v=document.getElementById('v'),st=document.getElementById('st');
function stop(){try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}}
function beep(){try{let A=window.AudioContext||window.webkitAudioContext,a=new A,o=a.createOscillator(),g=a.createGain();o.frequency.value=1250;g.gain.value=.18;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.1)}catch(e){}try{navigator.vibrate&&navigator.vibrate([70,30,70])}catch(e){}}
function found(x){if(done||!x)return;done=true;beep();document.getElementById('code').textContent=x;document.getElementById('ok').classList.add('show');stop();try{window.opener&&window.opener.postMessage({type:'TIRUPATI_BARCODE',barcode:String(x)},'*')}catch(e){}setTimeout(()=>window.close(),600)}
async function scan(t){if(done)return;if(t-last>100&&v.readyState>=2){last=t;try{if(detector){let a=await detector.detect(v);if(a[0])return found(a[0].rawValue)}}catch(e){}}requestAnimationFrame(scan)}
async function start(){try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});v.srcObject=stream;await v.play();if('BarcodeDetector'in window){try{let f=await BarcodeDetector.getSupportedFormats();detector=new BarcodeDetector({formats:['code_128','ean_13','ean_8','upc_a','upc_e','code_39','itf'].filter(x=>f.includes(x))})}catch(e){}}if(!detector&&window.ZXing){reader=new ZXing.BrowserMultiFormatReader();reader.decodeFromVideoElement(v,(r,e)=>{if(r)found(r.getText())})}let tr=stream.getVideoTracks()[0],c=tr.getCapabilities?tr.getCapabilities():{};if(c.torch)document.getElementById('torch').style.display='inline-block';st.textContent='Place barcode inside the box';requestAnimationFrame(scan)}catch(e){st.textContent='Camera blocked. Allow Camera permission in Chrome and reload.'}}
document.getElementById('torch').onclick=async()=>{try{let tr=stream.getVideoTracks()[0];torch=!torch;await tr.applyConstraints({advanced:[{torch:torch}]})}catch(e){}};start();
</script></body></html>
